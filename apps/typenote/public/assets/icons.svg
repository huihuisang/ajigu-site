<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <defs>

    <symbol id="icon-logo" viewBox="0 0 28 28">
      <rect x="2" y="2" width="24" height="24" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
      <rect x="6.5" y="2" width="4" height="12" rx="1.5" fill="currentColor"/>
      <rect x="13" y="2" width="4" height="12" rx="1.5" fill="currentColor"/>
      <rect x="19.5" y="2" width="4" height="12" rx="1.5" fill="currentColor"/>
      <line x1="10.5" y1="14" x2="10.5" y2="25" stroke="currentColor" stroke-width="1.5"/>
      <line x1="17" y1="14" x2="17" y2="25" stroke="currentColor" stroke-width="1.5"/>
    </symbol>

    <symbol id="icon-note" viewBox="0 0 36 36">
      <ellipse cx="10" cy="28" rx="7" ry="4.5" transform="rotate(-18 10 28)" fill="currentColor"/>
      <line x1="16.5" y1="26.5" x2="16.5" y2="7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M16.5 7 C22 5 28 9 26 15" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </symbol>

    <symbol id="icon-piano-keys" viewBox="0 0 64 32">
      <rect x="1" y="1" width="10" height="30" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
      <rect x="13" y="1" width="10" height="30" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
      <rect x="25" y="1" width="10" height="30" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
      <rect x="37" y="1" width="10" height="30" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
      <rect x="49" y="1" width="14" height="30" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
      <rect x="8" y="1" width="8" height="18" rx="2" fill="currentColor"/>
      <rect x="20" y="1" width="8" height="18" rx="2" fill="currentColor"/>
      <rect x="44" y="1" width="8" height="18" rx="2" fill="currentColor"/>
    </symbol>

    <symbol id="icon-clef" viewBox="0 0 28 28">
      <path d="M14 25 C8 25 5 21 5 17 C5 11 10 9 14 9 C18 9 22 12 22 17 C22 21 19 23 17 23 L17 4 C17 2 15.5 1.5 14 3 C12.5 4.5 12.5 8.5 14 9.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="14" y1="23" x2="14" y2="27" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>

    <symbol id="icon-download" viewBox="0 0 24 24">
      <line x1="12" y1="4" x2="12" y2="16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <polyline points="6,11 12,17 18,11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="4" y1="21" x2="20" y2="21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>

    <symbol id="icon-check" viewBox="0 0 24 24">
      <polyline points="4,12 9,17 20,7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <symbol id="icon-arrow-right" viewBox="0 0 24 24">
      <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <polyline points="13,6 19,12 13,18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <symbol id="icon-formats" viewBox="0 0 24 24">
      <rect x="3" y="6" width="14" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <line x1="7" y1="11" x2="12" y2="11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="7" y1="15" x2="10" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M9 2 L20 2 C21.1 2 22 2.9 22 4 L22 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.45"/>
    </symbol>

    <symbol id="icon-menubar" viewBox="0 0 24 24">
      <rect x="2" y="3" width="20" height="4.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="5.5" cy="5.25" r="0.85" fill="currentColor"/>
      <circle cx="8.5" cy="5.25" r="0.85" fill="currentColor"/>
      <circle cx="11.5" cy="5.25" r="0.85" fill="currentColor"/>
      <rect x="18.5" y="3.75" width="2" height="3" rx="0.5" fill="currentColor"/>
      <rect x="2" y="10" width="20" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
    </symbol>

    <symbol id="icon-menu-open" viewBox="0 0 24 24">
      <line x1="4" y1="7" x2="20" y2="7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="4" y1="17" x2="20" y2="17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>

    <symbol id="icon-close" viewBox="0 0 24 24">
      <line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="19" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>

