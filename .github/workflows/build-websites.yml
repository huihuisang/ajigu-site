name: Build website release candidates

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: website-release-candidates
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Set build directories
        run: |
          printf 'STUDIO_OUTPUT_DIR=%s/ajigu-websites\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'TASK_ARTIFACT_DIR=%s/ajigu-checks\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ajigu-checks"
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/check-build.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm test:layout
      - run: pnpm test:visual
      - run: pnpm test:header
      - run: pnpm test:locale
      - run: pnpm test:store
      - run: pnpm test:redirects
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ajigu-com
          path: ${{ runner.temp }}/ajigu-websites/ajigu
          include-hidden-files: true
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-evidence
          path: |
            ${{ runner.temp }}/ajigu-checks/browser
            ${{ runner.temp }}/ajigu-checks/layout
            ${{ runner.temp }}/ajigu-checks/visual-system
            ${{ runner.temp }}/ajigu-checks/header
            ${{ runner.temp }}/ajigu-checks/locale-routing
            ${{ runner.temp }}/ajigu-checks/store-downloads
            ${{ runner.temp }}/ajigu-checks/redirects
